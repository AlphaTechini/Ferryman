[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Deploy scripts read HYPE route JSON from ../deployments (read-only).
fs_permissions = [{ access = "read", path = "../deployments" }]
